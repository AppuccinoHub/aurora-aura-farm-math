/* AURAFX-CSS-BEGIN */
/* ===== AURA FX (shared): sound panel, points pill, points burst ===== */
.afx-backdrop{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,2,12,.78)}
.afx-backdrop.show{display:flex}
.afx-modal{width:100%;max-width:440px;background:#1d1030;border:2px solid #c44dff;border-radius:20px;padding:18px 16px 16px;color:#f5f0ff;box-shadow:0 10px 40px rgba(0,0,0,.6);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.afx-modal h3{font-size:22px;margin:0 0 12px;text-align:center}
.afx-row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;margin:0 0 10px;padding:10px 12px;border-radius:16px;border:2px solid rgba(196,77,255,.55);background:#261640;color:#f5f0ff;text-align:left;font:inherit;cursor:pointer}
.afx-row.on{border-color:#00f5d4;background:#12303a}
.afx-ico{font-size:26px;flex:0 0 auto}
.afx-txt{flex:1 1 auto;min-width:0}
.afx-txt b{display:block;font-size:19px}
.afx-txt small{display:block;font-size:15px;line-height:1.3;color:#d9d0ea;margin-top:2px}
.afx-sw{flex:0 0 auto;width:54px;height:30px;border-radius:15px;background:#4a3a63;position:relative;transition:background .15s}
.afx-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.afx-row.on .afx-sw{background:#00c9ad}
.afx-row.on .afx-knob{left:27px}
.afx-state{flex:0 0 auto;width:34px;font-weight:800;font-size:17px;text-align:center}
.afx-note{font-size:15px;color:#d9d0ea;text-align:center;margin:2px 0 12px}
.afx-done{display:block;width:100%;min-height:52px;border-radius:14px;border:none;font:inherit;font-size:19px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,#c44dff,#ff4d9e)}
.afx-row:focus-visible,.afx-done:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.pts-pill{font-weight:800;white-space:nowrap}
.afx-bump{animation:afxBump .4s ease-out}
@keyframes afxBump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.afx-burst{position:fixed;z-index:950;width:0;height:0;pointer-events:none}
.afx-pts{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:900 28px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ffd166;text-align:center;white-space:nowrap;
  padding:6px 12px;border-radius:14px;background:rgba(14,6,30,.9);border:2px solid rgba(255,209,102,.7);box-shadow:0 4px 16px rgba(0,0,0,.5);
  text-shadow:0 0 8px rgba(255,209,102,.6);animation:afxRise .9s ease-out forwards}
.afx-pts small{display:block;font-size:16px;font-weight:800;color:#fff;margin-top:4px;text-shadow:none}
.afx-dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:afxDot .6s ease-out forwards}
@keyframes afxRise{0%{opacity:0;transform:translate(-50%,-60%) scale(.8)}15%{opacity:1;transform:translate(-50%,-100%) scale(1.06)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-165%) scale(1)}}
@keyframes afxDot{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes afxFade{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
.afx-burst.still .afx-pts{transform:translate(-50%,-100%);animation:afxFade .9s linear forwards}
@media (prefers-reduced-motion:reduce){
  .afx-dot{display:none}
  .afx-pts{transform:translate(-50%,-100%);animation:afxFade .9s linear forwards !important}
  .afx-bump{animation:none}
  .afx-sw,.afx-knob{transition:none}
}
@media (max-width:520px){ .afx-row{min-height:68px;gap:10px} .afx-txt small{font-size:14px} }
/* auto-advance: a thin bar fills the Next button while the game waits (paused with the 🔊 panel) */
.afx-auto{position:relative;overflow:hidden}
.afx-auto::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.85);transform-origin:left center;transform:scaleX(0);animation:afxAuto var(--afx-auto,1500ms) linear forwards;pointer-events:none}
.afx-auto.afx-auto-paused::after{animation-play-state:paused}
@keyframes afxAuto{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){ .afx-auto::after{display:none} }

.afx-modal{font-family:"Andika",Verdana,sans-serif}

/* AURAFX-CSS-END */

:root{
  --bg1:#1f0f3a; --bg2:#3b1a63; --card:#fff8e8; --card2:#fff1cf; --ink:#1c1530; --ink2:#43385e;
  --pink:#ff4d9e; --purple:#6a2bc4; --purple2:#8b4dff; --teal:#0a7f71; --tealbg:#d9f7f1; --gold:#ffc94d;
  --ok:#0b7446; --oops:#9a4308; --amber:#ffe3a3; --line:#e7d9b5;
  --read:"Andika","Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  --head:"Fredoka","Andika",Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:#fff;font-family:var(--read);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
img{max-width:100%}
#app{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(1200px 500px at 70% -10%,#5a2a8f 0%,transparent 60%),radial-gradient(900px 500px at 0% 110%,#3d1470 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2))}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(2px 2px at 78% 12%,#fff9 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 8%,#fff7 50%,transparent 51%),radial-gradient(2px 2px at 90% 40%,#ffd16688 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 60%,#fff6 50%,transparent 51%),radial-gradient(2px 2px at 60% 92%,#fff5 50%,transparent 51%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 18px 14px;gap:10px;max-width:1300px;margin:0 auto}
.screen.active{display:flex}
/* HUD */
.hud{display:flex;align-items:center;gap:10px;min-height:56px;flex:0 0 auto}
.ico-btn{width:56px;height:56px;border-radius:16px;border:2px solid #ffffff40;background:#ffffff14;font-size:26px;display:grid;place-items:center;flex:0 0 auto;color:#fff;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.hud .title{flex:1 1 auto;min-width:0}
.hud .kick{font:600 15px/1.2 var(--head);color:#ffd9f0;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud h1,.hud h2{margin:0;font:600 26px/1.15 var(--head);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:#140a26;border:2px solid #ffc94d99;font:700 20px/1 var(--head);color:#ffe29a;white-space:nowrap}
.pill.fire{border-color:#ff8a4d99;color:#ffc2a0}
.dots{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff50}
.dots i.done{background:var(--gold);border-color:var(--gold)}
.dots i.now{background:#fff;border-color:#fff;box-shadow:0 0 0 3px #ff4d9e}
.hold-ring{position:absolute;inset:-4px;border-radius:19px;pointer-events:none;border:4px solid transparent}
.ico-btn.holding .hold-ring{border-color:var(--gold);animation:holdfill 3s linear forwards}
@keyframes holdfill{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* direction strip (written AND spoken) */
.dir{display:flex;align-items:center;gap:12px;flex:0 0 auto;background:#ffffff12;border:2px solid #ffffff2a;border-radius:18px;padding:8px 12px 8px 8px}
.dir .say{width:52px;height:52px;border-radius:14px;border:none;background:var(--gold);color:var(--ink);font-size:26px;flex:0 0 auto;display:grid;place-items:center}
.dir p{margin:0;font:700 23px/1.25 var(--read);color:#fff}
.dir small{display:block;font:400 17px/1.3 var(--read);color:#e9ddff}
/* main 2-col area */
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--card);color:var(--ink);border-radius:24px;padding:16px;box-shadow:0 8px 0 #0003,0 12px 30px #0005;min-height:0;position:relative}
.word{font:700 64px/1.1 var(--read);letter-spacing:.05em;color:var(--ink);overflow-wrap:anywhere;text-align:center}
.hear{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 18px;border-radius:16px;border:3px solid var(--purple);background:#fff;color:var(--purple);font:700 20px/1 var(--read)}
.hear.round{width:56px;padding:0;font-size:26px;flex:0 0 auto}
.hear.small{min-height:44px;width:44px;padding:0;font-size:21px;border-width:2px;flex:0 0 auto}
.pic{display:grid;place-items:center;border-radius:20px;background:linear-gradient(180deg,#fff,#fff3d6);border:3px solid var(--line);position:relative;overflow:hidden}
.pic .emo{font-size:96px;line-height:1}
.pic img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;display:block}
.pic.none{display:none}
.sent{font:400 24px/1.4 var(--read);color:var(--ink);margin:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--purple);height:1em;vertical-align:-2px}
.btn{min-height:64px;border-radius:18px;border:none;padding:0 22px;font:700 24px/1 var(--read);display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.btn.primary{background:linear-gradient(135deg,#7b2fd0,#d9368b);color:#fff;box-shadow:0 5px 0 #4a1a86}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 #064428}
.btn.oops{background:var(--oops);color:#fff;box-shadow:0 5px 0 #5a2604}
.btn.ghost{background:#fff;color:var(--purple);border:3px solid var(--purple)}
.btn.small{min-height:48px;font-size:18px;padding:0 14px;border-radius:14px}
.btn:disabled{opacity:.5}
.keys{font:400 16px/1.2 var(--read);color:var(--ink2);text-align:center;margin:0}
.task .keys{color:#e9ddff}
@media not all and (hover:hover) and (pointer:fine){ .keys{display:none} }
.why{border-radius:16px;padding:12px 14px;font:400 21px/1.4 var(--read);background:var(--tealbg);color:#0b3b35;border:3px solid #7fd8c7;display:none}
.why.show{display:block}
.why.try{background:#fff1d6;border-color:#f3c46a;color:#4a2c00}
.why b{font-weight:700}
.why .big{display:block;font:700 44px/1.2 var(--read);letter-spacing:.05em;margin:4px 0;color:var(--ink)}
.hl{background:#b9f3e6;color:#064a40;border-radius:6px;padding:0 3px;box-shadow:inset 0 -4px 0 #0a7f71}
.hl-her{background:var(--amber);color:#4a2c00;border-radius:6px;padding:0 3px;box-shadow:inset 0 -4px 0 #d08a00}
.nextrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.nextrow .btn{min-height:56px;font-size:21px}
.skip{background:transparent;border:2px solid #ffffff55;color:#fff;border-radius:14px;min-height:48px;padding:0 14px;font:700 17px/1 var(--read)}
.panel .skip{border-color:#c9b8ea;color:var(--purple)}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#140a26;color:#fff;border:2px solid var(--gold);border-radius:14px;padding:12px 16px;font:700 18px/1.3 var(--read);z-index:990;display:none;max-width:92vw;width:max-content;box-sizing:border-box;text-align:center}
#toast.show{display:block}

/* ===== HOME ===== */
#s-home .main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.garden{padding:0;overflow:hidden;display:flex;flex-direction:column;background:#bfe7ff center bottom/cover no-repeat}
.garden .sky{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px 0;gap:8px}
.hello{font:600 28px/1.1 var(--head);color:var(--ink);text-shadow:0 1px 0 #fff}
.weekchip{display:inline-block;margin-top:6px;background:#fffffff0;border:2px solid #1c153030;border-radius:12px;padding:6px 10px;font:700 17px/1.2 var(--read);color:var(--ink)}
.weekchip small{display:block;font-weight:400;font-size:15px;color:var(--ink2)}
.mascot{width:112px;height:128px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 6px 8px #0003)}
.mascot img{height:100%;width:auto}
.beds{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px 4px;align-content:end;padding:6px 10px 8px}
.plant{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;border:none;background:transparent;padding:2px;border-radius:12px}
.plant img{height:50px;width:auto;filter:drop-shadow(0 3px 3px #0003)}
.plant .w{font:700 15px/1.1 var(--read);color:#1c2a0e;background:#fffffff0;border-radius:6px;padding:2px 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plant.hfw .w{background:#fff4c8}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:4px 10px 8px;font:700 14px/1.2 var(--read);color:#17330a;background:#ffffffc8}
.legend img{height:18px;vertical-align:-4px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.today{background:linear-gradient(135deg,#fff8e8,#ffe9f5);color:var(--ink);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #0003}
.today .lab{font:600 18px/1.2 var(--head);color:#8a1f5c;display:flex;align-items:center;gap:8px}
.today .done{font:700 17px/1.3 var(--read);color:var(--ok)}
.play{width:100%;min-height:68px;font-size:25px}
.stations{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;min-height:0}
.st{background:var(--card);color:var(--ink);border:none;border-radius:20px;padding:10px 10px 8px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;align-items:center;box-shadow:0 6px 0 #0003;min-height:96px;position:relative}
.st .big{font-size:40px;grid-row:1 / span 3;line-height:1}
.st b{font:600 21px/1.15 var(--head)}
.st small{font:400 16px/1.25 var(--read);color:var(--ink2)}
.st .stars{font-size:16px;letter-spacing:1px}
.st.sugg{box-shadow:0 0 0 4px var(--pink),0 6px 0 #0003}
.st .tick{position:absolute;right:8px;top:6px;font:700 14px/1 var(--read);color:var(--ok);background:#d8f6ea;border-radius:8px;padding:3px 6px}
.st:disabled{opacity:.6}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:52px;border-radius:16px;border:2px solid #ffffff55;background:#ffffff18;color:#fff;padding:0 14px;font:700 18px/1 var(--read);display:inline-flex;align-items:center;gap:8px}
.chip .n{background:var(--pink);color:#fff;border-radius:10px;padding:3px 7px;font-size:15px}
.chip.hot{border-color:var(--gold);background:#ffc94d2a}

/* ===== END MODAL / GATE ===== */
.modal{position:fixed;inset:0;background:#12082acc;display:none;align-items:center;justify-content:center;z-index:800;padding:14px}
.modal.show{display:flex}
.mbox{background:var(--card);color:var(--ink);border-radius:26px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 12px 40px #0008;max-height:96vh;overflow:auto}
.mbox h2{margin:0;font:600 32px/1.15 var(--head)}
.mbox p{margin:0;font:400 21px/1.35 var(--read)}
.mbox img.lamb{height:150px;width:auto}
.mbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mbox input{font:700 34px/1 var(--read);width:160px;text-align:center;border:3px solid var(--purple2);border-radius:14px;min-height:64px}
.grewlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.grewlist span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 8px;font:700 18px/1.2 var(--read)}

/* ===== GROWN-UPS ===== */
#s-grown .main{grid-template-columns:minmax(0,.62fr) minmax(0,2fr)}
.weeks{display:flex;flex-direction:column;gap:8px;overflow:auto}
.wk{border-radius:14px;border:2px solid var(--line);background:#fff;padding:9px 11px;text-align:left;color:var(--ink);font:700 17px/1.2 var(--read)}
.wk small{display:block;font:400 14px/1.3 var(--read);color:var(--ink2)}
.wk.on{border-color:var(--purple);box-shadow:0 0 0 3px #8b4dff44;background:#faf6ff}
.wk.cur{border-left:8px solid var(--pink)}
.editor{overflow:auto;display:flex;flex-direction:column;gap:14px}
.editor h3{margin:0;font:600 22px/1.2 var(--head);color:var(--ink)}
.editor h4{margin:0;font:700 18px/1.2 var(--read);color:var(--ink)}
.sec{border-top:2px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.src{font:400 15px/1.35 var(--read);color:var(--ink2)}
.flag{background:#fff0c7;border:2px solid #f3c46a;border-radius:12px;padding:10px 12px;font:400 16px/1.35 var(--read);color:#4a2c00}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;font:700 19px/1 var(--read);color:var(--ink)}
.wchip button{border:none;background:#f1e9ff;border-radius:9px;width:34px;height:34px;font-size:16px;color:var(--purple)}
.wchip.teacher{border-color:#f3c46a;background:#fff8e6}
.vtab{width:100%;border-collapse:collapse;font:400 16px/1.3 var(--read)}
.vtab th{text-align:left;font-weight:700;color:var(--ink2);padding:4px 6px;border-bottom:2px solid var(--line)}
.vtab td{padding:5px 6px;border-bottom:1px solid #eee2c4;vertical-align:middle}
.vtab td:first-child{font-weight:700;font-size:17px;white-space:nowrap}
.vtab input[type=text]{width:100%;font:400 16px/1.2 var(--read);padding:6px 8px;border:2px solid var(--line);border-radius:8px;min-width:120px}
.badge{display:inline-block;border-radius:8px;padding:3px 7px;font:700 13px/1.2 var(--read);white-space:nowrap}
.badge.ok{background:#d8f6ea;color:#0b5a38}.badge.draft{background:#fff0c7;color:#6a4500}.badge.off{background:#eee;color:#555}
.gbtns{display:flex;flex-wrap:wrap;gap:8px}
.gbtns .btn{min-height:50px;font-size:17px;padding:0 14px}
.gform{display:flex;flex-direction:column;gap:8px}
.gform textarea{width:100%;min-height:80px;font:400 17px/1.35 var(--read);border:2px solid var(--line);border-radius:10px;padding:8px}
.gform input[type=text],.gform input[type=date],.gform select{font:400 17px/1.2 var(--read);border:2px solid var(--line);border-radius:10px;padding:8px;min-height:44px}
.gform label{font:700 16px/1.3 var(--read);color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font:700 16px/1.2 var(--read);color:var(--ink)}
.tg i{font-style:normal;border-radius:8px;padding:3px 7px;background:#d8f6ea;color:#0b5a38}
.tg i.off{background:#eee;color:#555}
.rtab{width:100%;border-collapse:collapse;font:400 15px/1.3 var(--read)}
.rtab td,.rtab th{border-bottom:1px solid #eee2c4;padding:5px 6px;text-align:left;vertical-align:top}


/* ===== Aura Farm · Math ===== */
:root{ --ones:#e8890c; --onesbg:#fff1d9; --tens:#1f6fd1; --tensbg:#e3efff; --hund:#7a3fe0; --hundbg:#f1e8ff; }
.co{color:var(--ones)} .ct{color:var(--tens)} .ch{color:var(--hund)}
.hidden-sr{position:absolute;left:-9999px}
/* home sets */
.stations{grid-template-columns:1fr 1fr}
.st .prog{font:700 14px/1.2 var(--read);color:var(--ink2)}
.st.school{box-shadow:0 0 0 3px #ffc94d,0 6px 0 #0003}
.st.school .big::after{content:"";}
.plant .w{font-size:14px;letter-spacing:.01em}
.beds{grid-template-columns:repeat(5,1fr)}
.legend span{white-space:nowrap}
/* play layout */
.playmain{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.probpanel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;background:linear-gradient(180deg,#fffaf0,#fff1cf)}
.probtop{display:flex;align-items:center;gap:10px;align-self:stretch}
.pemo{font-size:40px;line-height:1}
.pnum{flex:1 1 auto;font:600 20px/1.2 var(--head);color:var(--ink2)}
.plamb{position:absolute;left:8px;bottom:6px;width:84px;pointer-events:none}
.plamb img{width:100%;height:auto;filter:drop-shadow(0 4px 6px #0003)}
/* the vertical problem */
.vert{display:grid;grid-template-columns:56px repeat(3,84px);grid-auto-rows:auto;column-gap:8px;row-gap:4px;align-items:center;justify-items:center;margin:4px auto 8px}
.vert.sub{grid-template-columns:56px repeat(2,84px)}
.vert.sub3{grid-template-columns:56px repeat(3,84px)}
.vert .dg.h{color:#4a1f99}
.vert .hdr{font:700 16px/1 var(--read);padding:3px 0;border-radius:8px;width:100%;text-align:center}
.vert .hdr.h{color:var(--hund);background:var(--hundbg)} .vert .hdr.t{color:var(--tens);background:var(--tensbg)} .vert .hdr.o{color:var(--ones);background:var(--onesbg)}
.vert .dg{font:700 72px/1 var(--read);color:var(--ink);height:80px;display:grid;place-items:center;position:relative}
.vert .dg.t{color:#0f3f86} .vert .dg.o{color:#7a4300}
.vert .op{font:700 60px/1 var(--read);color:var(--ink)}
.vert .bar{grid-column:1 / -1;height:7px;width:100%;background:var(--ink);border-radius:4px;margin:2px 0}
.vert.tri .dg{font-size:62px;height:66px}
.vert.tri .op{font-size:52px}
.hq .mten{display:block;font:700 17px/1.25 var(--read);color:#8a4b00;background:#fff4c2;border-radius:10px;padding:3px 8px;margin-top:4px;width:fit-content}
.plant .w.w3{font-size:11px;letter-spacing:0}
.vert .dg.xed::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:6px;background:#d33;transform:rotate(-20deg);border-radius:3px}
.box{width:80px;height:92px;border-radius:16px;border:4px dashed #b9a7e6;background:#fff;font:700 64px/1 var(--read);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.box.t{border-color:#9cc1f0} .box.o{border-color:#f3c27a} .box.h{border-color:#cdb6f5;background:#fdfbff}
.box.filled{border-style:solid}
.box.cur{box-shadow:0 0 0 6px #8b4dff55;border-color:var(--purple2);border-style:solid}
.box.bad{background:#fff1d6;border-color:#d08a00;animation:shake .4s}
.box.good{background:#e3fff6;border-color:#12a07f;border-style:solid;color:#064a40}
.box.h:not(.filled):not(.cur){opacity:.55}
.box.small{width:52px;height:52px;font-size:34px;border-radius:12px;border-width:3px}
.box.small.wide{width:70px}
.scr{display:flex;align-items:flex-end;justify-content:center;height:56px}
.scr .lab{font:400 12px/1.1 var(--read);color:var(--ink2);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){ .box.bad{animation:none} }
/* keypad */
.padpanel{display:flex;flex-direction:column;gap:10px;overflow:auto}
#padArea{display:flex;flex-direction:column;gap:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:70px;border-radius:18px;border:3px solid #eccb6a;background:#fff7d6;box-shadow:0 5px 0 #d9ae3a;font:700 40px/1 var(--read);color:var(--ink);touch-action:manipulation}
.keypad button:active{transform:translateY(3px);box-shadow:0 2px 0 #d9ae3a}
.keypad .kdel{background:#fff;border-color:#c9b8ea;box-shadow:0 5px 0 #a58fd6;color:var(--purple);font-size:34px}
.keypad .kchk{background:var(--ok);border-color:#064428;box-shadow:0 5px 0 #064428;color:#fff}
.padrow{display:flex;gap:10px;align-items:center}
.helpbtn{flex:1 1 auto;background:linear-gradient(135deg,#0a7f71,#13a58f);color:#fff;box-shadow:0 5px 0 #06564c;min-height:60px;font-size:22px}
.helpbtn.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 8px #13a58f55,0 5px 0 #06564c}}
.why{font-size:20px}
.why .tryline{display:block;margin-top:4px;font-weight:700}
/* help walkthrough */
#helpArea{display:flex;flex-direction:column;gap:10px}
.htop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.htop b{font:600 24px/1.1 var(--head);color:var(--ink)}
.hpick{font:400 17px/1.2 var(--read);color:var(--ink2)}
.strats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.strats button{min-height:62px;border-radius:14px;border:3px solid #d9c6ff;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font:700 14px/1.1 var(--read)}
.strats button i{font-style:normal;font-size:24px;line-height:1}
.strats button.on{border-color:var(--purple);background:var(--purple);color:#fff}
.hvis{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hq{display:flex;gap:10px;align-items:center}
.hq .say{width:48px;height:48px;border-radius:14px;border:none;background:var(--gold);color:var(--ink);font-size:24px;flex:0 0 auto;display:grid;place-items:center}
.hq p{margin:0;font:700 23px/1.3 var(--read);color:var(--ink)}
.hq p small{display:block;font-weight:400;font-size:18px;color:var(--ink2)}
.hopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hopts.two{grid-template-columns:repeat(2,1fr)}
.hopts.one{grid-template-columns:1fr}
.hopt{min-height:72px;border-radius:18px;border:3px solid #d9c6ff;background:#fff;color:var(--ink);font:700 36px/1 var(--read);box-shadow:0 5px 0 #0002}
.hopt.word{font-size:28px}
.hopt.right{background:#e3fff6;border-color:#12a07f}
.hopt.nope{opacity:.4}
.hdo{min-height:72px;font-size:22px}
.hmsg{border-radius:14px;padding:10px 12px;font:400 20px/1.35 var(--read);display:none}
.hmsg.show{display:block}
.hmsg.ok{background:var(--tealbg);color:#0b3b35;border:3px solid #7fd8c7}
.hmsg.try{background:#fff1d6;color:#4a2c00;border:3px solid #f3c46a}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdots{display:flex;flex-wrap:nowrap;gap:3px;min-width:0}
.hdots i{width:12px;height:12px;flex:0 1 12px;min-width:7px;background:#e4d8f7;border-color:#c9b8ea}
.hfoot .btn{flex:0 0 auto}
.hdots i.done{background:var(--gold);border-color:#d9a400}
.hdots i.now{background:#fff;border-color:var(--pink)}
.hdone{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hdone img{height:110px;width:auto}
.hdone p{margin:0;font:700 24px/1.3 var(--read);color:var(--ink)}
/* base-ten blocks */
.blocks{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap;width:100%}
.bgroup{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;background:#faf6ee}
.bl-lab{font:700 22px/1 var(--read);color:var(--ink)}
.bl-body{display:flex;align-items:flex-end;gap:5px;min-height:82px}
.bplus{font:700 40px/1 var(--read);color:var(--ink);align-self:center}
.flat{display:block;width:78px;height:78px;border-radius:4px;background-color:#b58cf5;border:2px solid #5b2bb0;
  background-image:linear-gradient(#5b2bb066 1px,transparent 1px),linear-gradient(90deg,#5b2bb066 1px,transparent 1px);background-size:7.4px 7.4px}
.rod{display:block;width:15px;height:78px;border-radius:3px;background:#6ea8f0;border:2px solid #1f5fb3;background-image:linear-gradient(#1f5fb377 1px,transparent 1px);background-size:100% 7.4px}
.cubes{display:grid;grid-template-rows:repeat(5,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:2px;align-self:flex-end}
.cube{display:block;width:14px;height:14px;border-radius:3px;background:#ffb547;border:2px solid #c46d00}
.rod.new,.cube.new,.flat.new{animation:pop .5s ease-out;box-shadow:0 0 0 3px #12a07f}
.cube.grp,.rod.grp{box-shadow:0 0 0 3px #ff4d9e}
.rod.x,.cube.x{opacity:.35;position:relative}
.rod.x::after,.cube.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#c00;font:900 13px/1 sans-serif}
.hl-o .cube{box-shadow:0 0 0 2px #ffd38a}
.blk-note{font:700 18px/1.2 var(--read);color:var(--ink2);text-align:center;width:100%}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .rod.new,.cube.new,.flat.new{animation:none} }
/* break apart */
.split{display:flex;flex-direction:column;gap:6px;width:100%;font:700 26px/1.2 var(--read);color:var(--ink)}
.split .row{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.split .tag{font:400 15px/1 var(--read);color:var(--ink2);width:62px;text-align:right}
.chipn{display:inline-grid;place-items:center;min-width:52px;height:44px;padding:0 8px;border-radius:12px;background:#fff;border:3px solid var(--line)}
.chipn.t{background:var(--tensbg);border-color:#9cc1f0;color:#0f3f86}
.chipn.o{background:var(--onesbg);border-color:#f3c27a;color:#7a4300}
.chipn.q{background:#f4ecff;border:3px dashed var(--purple2);color:var(--purple)}
.split .arrow{color:var(--ink2)}
.grp{display:grid;align-items:center;justify-items:center;column-gap:4px;row-gap:6px;font:700 24px/1.1 var(--read);color:var(--ink)}
.grp.g2{grid-template-columns:auto 22px minmax(58px,auto) 18px minmax(58px,auto)}
.grp.g3{grid-template-columns:auto 20px minmax(58px,auto) 16px minmax(58px,auto) 16px minmax(50px,auto)}
.grp .glab{justify-self:end;white-space:nowrap}
.grp .glab b{color:var(--ink2)}
.grp .glab.small{font:400 15px/1 var(--read);color:var(--ink2)}
.grp .ghdr{font:700 13px/1 var(--read);padding:3px 6px;border-radius:8px}
.grp .ghdr.h{color:var(--hund);background:var(--hundbg)} .grp .ghdr.t{color:var(--tens);background:var(--tensbg)} .grp .ghdr.o{color:var(--ones);background:var(--onesbg)}
.grp .gc{border-radius:12px;padding:2px}
.grp .gc.ghl{background:#fff4c2;box-shadow:0 0 0 3px #ffd34d}
.grp .grule{grid-column:1/-1;height:5px;width:100%;background:var(--ink);border-radius:3px}
.grp .gtot{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.grp .gcell{display:flex;flex-direction:column;align-items:center;line-height:1}
.grp s.old{font-size:15px;color:#999;text-decoration-color:#d33;text-decoration-thickness:3px}
.chipn.h{background:var(--hundbg);border-color:#cdb6f5;color:#4a1f99}
.chipn.gsum{box-shadow:0 0 0 3px #12a07f55}
.blocks.mini .flat{width:46px;height:46px;background-size:4.4px 4.4px}
.blocks.mini .rod{width:9px;height:46px;background-size:100% 4.4px}
.blocks.mini .cubes{grid-template-rows:repeat(5,8px);grid-auto-columns:8px}
.blocks.mini .cube{width:8px;height:8px;border-width:1px}
.blocks.mini .bl-body{min-height:48px;gap:3px}
.bl-body{flex-wrap:wrap;justify-content:center;max-width:100%}
.mstack.s3{grid-template-columns:40px repeat(3,52px)}
.mstack.sub.s3{grid-template-columns:40px repeat(3,60px)}
.mstack .h{color:#4a1f99}
/* number line */

<script>
// AURAFX-JS-BEGIN
/* ===================== AURA FX (shared by both Aura Farm games) =====================
   Sound effects, calm procedural background music, the 🔊 sound panel and the points burst.
   Master copy: /workspace/apps/shared/aurafx/aurafx.js (each game's build step inlines it).
   Everything is generated with the Web Audio API: no audio files and no network requests.
   Every audio call is wrapped in try/catch; with no AudioContext everything becomes a no-op.
   The AudioContext is only created after a real user gesture (browser autoplay rules). */
const AuraFX = (function(){
  "use strict";
  const S = {sfx:true, music:false};          /* classroom defaults: sounds on, music off */
  let KEY = "auraFX.v1";
  const W = typeof window!=="undefined" ? window : {};
  const AC_CLASS = W.AudioContext || W.webkitAudioContext || null;
  function load(){ try{ const v = JSON.parse(W.localStorage.getItem(KEY)); if(v && typeof v==="object"){ if(typeof v.sfx==="boolean") S.sfx=v.sfx; if(typeof v.music==="boolean") S.music=v.music; } }catch(e){} }
  function save(){ try{ W.localStorage.setItem(KEY, JSON.stringify({sfx:S.sfx, music:S.music})); }catch(e){} }

  /* ---------------- audio graph ---------------- */
  let ac=null, out=null, sfxBus=null, unlocked=false;
  function gestureSeen(){ try{ return unlocked || !!(navigator.userActivation && navigator.userActivation.hasBeenActive); }catch(e){ return unlocked; } }
  function limiter(c){ const k=c.createDynamicsCompressor(); try{ k.threshold.value=-10; k.knee.value=8; k.ratio.value=12; k.attack.value=0.004; k.release.value=0.3; }catch(e){} return k; }
  function ctx(){
    if(ac) return ac;
    if(!AC_CLASS || !gestureSeen()) return null;
    try{
      ac = new AC_CLASS();
      out = limiter(ac); out.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(out);
    }catch(e){ ac=null; }
    return ac;
  }
  function resume(){ try{ const c=ctx(); if(c && c.state==="suspended"){ const p=c.resume(); if(p && p.catch) p.catch(()=>{}); } }catch(e){} }

  /* one enveloped oscillator: soft attack, exponential decay, optional glide and low-pass */
  function voice(c, dest, t, f, dur, o){
    o = o || {};
    const osc=c.createOscillator(), g=c.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t);
    if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t+dur*0.8);
    if(o.detune) osc.detune.setValueAtTime(o.detune, t);
    const a=o.attack||0.005, v=o.vol||0.1;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t+a);
    if(o.hold) g.gain.setValueAtTime(v, t+a+o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    let node = osc;
    if(o.lp){ const f2=c.createBiquadFilter(); f2.type="lowpass"; f2.frequency.setValueAtTime(o.lp, t); f2.Q.value=0.4; osc.connect(f2); node=f2; }
    node.connect(g); g.connect(dest);
    osc.start(t); osc.stop(t+dur+0.05);
  }

  /* ---------------- sound effects ---------------- */
  const SFX = {
    click(c,d,t){ voice(c,d,t,1100,0.06,{vol:0.1,attack:0.003,glide:700}); },
    ok(c,d,t){      /* two-note chime, G5 then C6, with a soft bell partial */
      [[784,0],[1046.5,0.1]].forEach(([f,dt])=>{ voice(c,d,t+dt,f,0.6,{vol:0.15,attack:0.004}); voice(c,d,t+dt,f*2,0.25,{vol:0.025,attack:0.004}); });
    },
    bad(c,d,t){     /* gentle low falling tone, filtered, no buzz */
      voice(c,d,t,247,0.42,{type:"triangle",vol:0.12,attack:0.02,glide:196,lp:900});
      voice(c,d,t,123.5,0.42,{vol:0.06,attack:0.02,glide:98});
    },
    fanfare(c,d,t){ /* C5 E5 G5, then a warm C major chord with C6 on top */
      [523.25,659.25,783.99].forEach((f,i)=>voice(c,d,t+i*0.12,f,0.32,{type:"triangle",vol:0.1,attack:0.006,lp:2600}));
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>voice(c,d,t+0.38,f,1.3,{type:i===3?"sine":"triangle",vol:i===3?0.09:0.06,attack:0.01,lp:3000}));
      voice(c,d,t+0.38,2093,0.5,{vol:0.02,attack:0.005});
    },
    soft(c,d,t){    /* "round over" without the fanfare (for a round that isn't Done yet) */
      voice(c,d,t,587.33,0.5,{type:"triangle",vol:0.09,attack:0.01,lp:2000});
      voice(c,d,t+0.16,440,0.8,{type:"triangle",vol:0.09,attack:0.01,lp:2000});
    }
  };
  let lastClick=0;
  function play(kind){
    if(!S.sfx || !SFX[kind]) return;
    try{
      const c=ctx(); if(!c) return;
      resume();
      if(kind==="click"){ const n=c.currentTime; if(n-lastClick<0.035) return; lastClick=n; }
      SFX[kind](c, sfxBus, c.currentTime+0.01);
    }catch(e){}
  }

  /* ---------------- procedural music ----------------
     68 BPM, F major. Warm pad chords (2 bars each), soft sine bass, a slow pentatonic melody
     in 2-bar call-and-response phrases, and a light arpeggio in some sections.
     Every 8 bars a new section picks another progression and which layers play, so it never
     loops exactly but always stays in the same calm key. Original material.
     Tempo: each bar is planned as events on a beat grid; the scheduler turns beats into seconds
     half a beat at a time, using a tempo multiplier (1 = 68 BPM, max 1.3) that glides toward the
     game's target by at most TEMPO_SLEW per second. Only note timing changes: pitch never changes
     (oscillator frequencies are fixed, the echo time is fixed), so a ramp has no pitch jumps. */
  const BPM=68, BEAT=60/BPM, BAR=BEAT*4, STEP=0.5;
  const TEMPO_MAX=1.3, TEMPO_SLEW=0.06, LOOKAHEAD=1.0;
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  const CH = {
    F:  {pad:[53,57,60,64], bass:41, tones:[65,69,72,77,81]},  /* Fmaj7 */
    Dm: {pad:[50,53,57,60], bass:38, tones:[62,65,69,72,74,77]},/* Dm7 */
    Bb: {pad:[50,53,58,60], bass:46, tones:[62,65,72,74,77]},  /* Bb(add9) */
    C:  {pad:[52,55,60,62], bass:36, tones:[67,72,74,79]},     /* Cadd9 */
    Gm: {pad:[53,55,58,62], bass:43, tones:[67,74,77,79]},     /* Gm7 */
    Am: {pad:[52,55,57,60], bass:45, tones:[69,72,79,81]}      /* Am7 */
  };
  const PROGS = [["F","Am","Bb","C"],["Dm","Bb","F","C"],["Bb","Am","Gm","C"],["F","Dm","Gm","Bb"],["Dm","Gm","Bb","C"],["F","C","Dm","Bb"]];
  const MEL = [62,65,67,69,72,74,77,79,81];   /* F major pentatonic, D4 to A5 */
  const RHY = [[0,1.5,3],[0,2],[0.5,2,3],[0,1,2.5],[1,2.5],[0,3],[0,1.5,2.5],[0,2,3]];
  function clampTempo(x){ x=Number(x); return Number.isFinite(x) ? Math.max(1, Math.min(TEMPO_MAX, x)) : 1; }
  function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function impulse(c, secs){
    const n=Math.floor(c.sampleRate*secs), b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); let lp=0; for(let i=0;i<n;i++){ lp = lp*0.6 + (Math.random()*2-1)*0.4; d[i]=lp*Math.pow(1-i/n,2.6); } }
    return b;
  }
  function Engine(c, dest, seed){
    const R = rng(seed);
    const pick = a => a[Math.floor(R()*a.length)];
    /* graph: layers -> mix -> dest; sends -> reverb / echo -> mix */
    const mix=c.createGain(); mix.gain.value=0.55; mix.connect(dest);
    const rev=c.createConvolver(); rev.buffer=impulse(c,3.2); const revG=c.createGain(); revG.gain.value=0.5; rev.connect(revG); revG.connect(mix);
    const dly=c.createDelay(2); dly.delayTime.value=BEAT*0.75; const fb=c.createGain(); fb.gain.value=0.32; const dlp=c.createBiquadFilter(); dlp.type="lowpass"; dlp.frequency.value=2200;
    dly.connect(dlp); dlp.connect(fb); fb.connect(dly); const dG=c.createGain(); dG.gain.value=0.28; dlp.connect(dG); dG.connect(mix); dG.connect(rev);
    function pan(v){ if(c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=v; return p; } return c.createGain(); }
    const padB=c.createGain(); padB.gain.value=1; padB.connect(mix); const padS=c.createGain(); padS.gain.value=0.6; padB.connect(padS); padS.connect(rev);
    const bassB=c.createGain(); bassB.gain.value=1; bassB.connect(mix);
    const melP=pan(-0.12), melB=c.createGain(); melB.connect(melP); melP.connect(mix); const melS=c.createGain(); melS.gain.value=0.45; melP.connect(melS); melS.connect(rev); melP.connect(dly);
    const arpP=pan(0.22), arpB=c.createGain(); arpB.connect(arpP); arpP.connect(mix); const arpS=c.createGain(); arpS.gain.value=0.5; arpP.connect(arpS); arpS.connect(rev);

    let bar=0, sec=null, lastProg=-1, mi=4, rhyA=null;
    /* beat clock: events wait in q as {b: absolute beat, fn(time, secondsPerBeat)} */
    let q=[], curBeat=0, curT=0, tempo=1;
    const at=(b, fn)=>q.push({b, fn});
    function plan(n){
      let p; do{ p=Math.floor(R()*PROGS.length); }while(p===lastProg); lastProg=p;
      if(n===0) return {prog:PROGS[0], mel:false, arp:false, intro:true};
      const r=R();
      if(r<0.12) return {prog:PROGS[p], mel:false, arp:false};         /* breathing space */
      if(r<0.50) return {prog:PROGS[p], mel:true,  arp:false};
      if(r<0.78) return {prog:PROGS[p], mel:false, arp:true};
      return {prog:PROGS[p], mel:true, arp:true, sparseArp:true};
    }
    function pad(t, chord, spb, dt0){
      const dur=spb*8, rel=2.4, f=c.createBiquadFilter(); f.type="lowpass"; f.Q.value=0.5;
      f.frequency.setValueAtTime(650,t); f.frequency.linearRampToValueAtTime(1150,t+dur*0.55); f.frequency.linearRampToValueAtTime(720,t+dur+rel);
      const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+1.4); g.gain.setValueAtTime(1,t+dur); g.gain.linearRampToValueAtTime(0,t+dur+rel);
      f.connect(g); g.connect(padB);
      chord.pad.forEach((m,i)=>{ [[-7,"triangle",0.030],[7,"sine",0.034]].forEach(([dt,type,v],k)=>{
        const o=c.createOscillator(), og=c.createGain(); o.type=type; o.frequency.value=mtof(m); o.detune.value=dt+dt0[i*2+k]; og.gain.value=v*(i===0?1.1:1);
        o.connect(og); og.connect(f); o.start(t); o.stop(t+dur+rel+0.1); }); });
    }
    function bass(t, chord, strong, spb){
      const o=c.createOscillator(), g=c.createGain(), len=spb*4; o.type="sine"; o.frequency.value=mtof(chord.bass);
      const v=strong?0.085:0.06; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.08); g.gain.exponentialRampToValueAtTime(v*0.35,t+len*0.9); g.gain.linearRampToValueAtTime(0,t+len+0.3);
      o.connect(g); g.connect(bassB); o.start(t); o.stop(t+len+0.4);
    }
    function note(t, m, len, vel){
      const f=mtof(m), g=c.createGain(); g.connect(melB);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+0.025); g.gain.exponentialRampToValueAtTime(vel*0.4,t+len*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+len+0.9);
      [[1,"sine",1],[2,"sine",0.18],[1,"triangle",0.22]].forEach(([mul,type,v],k)=>{ const o=c.createOscillator(), og=c.createGain(); o.type=type; o.frequency.value=f*mul; if(k===2) o.detune.value=5; og.gain.value=v; o.connect(og); og.connect(g); o.start(t); o.stop(t+len+1); });
    }
    function melody(base, chord, barInPhrase){
      if(barInPhrase===0){ if(R()<0.2) { rhyA=null; return; } rhyA=pick(RHY); }
      else if(!rhyA || R()<0.3) return;        /* the answer bar sometimes rests */
      const rh = barInPhrase===0 ? rhyA : (R()<0.6 ? rhyA : pick(RHY));
      rh.forEach((b,k)=>{
        if(k===0){ let best=mi, bd=99; MEL.forEach((m,j)=>{ if(chord.tones.includes(m)){ const d=Math.abs(j-mi)+R()*0.8; if(d<bd){bd=d;best=j;} } }); mi=best; }
        else { mi = Math.max(1, Math.min(MEL.length-2, mi + pick([-2,-1,-1,1,1,2,0]))); }
        const next = k+1<rh.length ? rh[k+1] : 4, lenB = Math.max(0.6, Math.min(1.8, next-b))*0.95;
        const m=MEL[mi], jit=R()*0.02, vel=0.11+R()*0.03;
        at(base+b, (t,spb)=>note(t+jit, m, lenB*spb, vel));
      });
    }
    function arp(base, chord, sparse){
      const ns = chord.pad.map(m=>m+12), pat = pick([[0,1,2,3,2,1,2,3],[0,2,1,3,0,2,1,3],[3,2,1,0,1,2,3,2]]);
      for(let s=0;s<8;s++){
        if(R() > (sparse?0.5:0.85)) continue;
        const m=ns[pat[s]], v=0.045+R()*0.015;
        at(base+s*STEP, tt=>{
          const o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
          o.type="triangle"; o.frequency.value=mtof(m); f.type="lowpass"; f.frequency.value=1800;
          g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(v,tt+0.006); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.42);
          o.connect(f); f.connect(g); g.connect(arpB); o.start(tt); o.stop(tt+0.45);
        });
      }
    }
    function planBar(){
      const base=bar*4, inSec = bar%8; if(inSec===0) sec = plan(Math.floor(bar/8));
      const chord = CH[sec.prog[Math.floor(inSec/2)]];
      if(inSec%2===0){ const dt0=chord.pad.flatMap(()=>[R()*4-2, R()*4-2]); at(base, (t,spb)=>pad(t, chord, spb, dt0)); }
      const strong = inSec%2===0; at(base, (t,spb)=>bass(t, chord, strong, spb));
      if(sec.mel && !(sec.intro)) melody(base, chord, inSec%2);
      if(sec.intro && inSec>=4) melody(base, chord, inSec%2);
      if(sec.arp) arp(base, chord, sec.sparseArp);
      bar++;
    }
    /* schedule everything up to audio time `until`; target(t) gives the wanted tempo */
    function advance(until, target, log){
      let guard=0;
      while(curT < until && guard++ < 20000){
        if(curBeat >= bar*4) planBar();
        const want=clampTempo(target(curT)), maxD=TEMPO_SLEW*STEP*BEAT/tempo;
        tempo += Math.max(-maxD, Math.min(maxD, want-tempo));
        const spb=BEAT/tempo, end=curBeat+STEP-1e-6, keep=[];
        for(const ev of q){ if(ev.b < end){ try{ ev.fn(curT + Math.max(0, ev.b-curBeat)*spb, spb); }catch(e){} } else keep.push(ev); }
        q=keep;
        if(log) log.push([curT, tempo]);
        curT += STEP*spb; curBeat += STEP;
      }
    }
    return { advance, start(t){ curT=t; }, catchUp(now){ if(curT < now+0.05) curT = now+0.1; },
      get bar(){ return bar; }, get tempo(){ return tempo; }, get time(){ return curT; } };
  }

  let eng=null, mBus=null, timer=null, playing=false, hiddenPause=false, tempoTarget=1;
  const MUSIC_LEVEL = 0.5;   /* music bus level: clearly quieter than the effects */
  function tick(){
    try{
      const c=ac; if(!c || !eng) return;
      eng.catchUp(c.currentTime);   /* never schedule in the past (e.g. after a busy moment) */
      eng.advance(c.currentTime+LOOKAHEAD, ()=>tempoTarget);
    }catch(e){}
  }
  /* the game sets the wanted tempo (1 = normal … 1.3); the engine glides there smoothly */
  function setTempo(x){ tempoTarget = clampTempo(x); return tempoTarget; }
  /* untimed rounds: a gentle lift over the last 3 questions (i = 0-based index of the current one) */
  function tempoForQuestion(i, n){
    i=Number(i); n=Number(n); if(!(n>0) || !Number.isFinite(i)) return 1;
    const left=n-i; if(left>3 || left<1) return 1;
    return 1 + 0.25*(4-left)/3;           /* 3 left: +8%, 2 left: +17%, last one: +25% */
  }
  /* timed modes: ramp up over the final stretch (30% of the time, at least 10 s, at most 30 s) */
  function tempoForTime(left, total){
    left=Number(left); total=Number(total); if(!(total>0) || !Number.isFinite(left)) return 1;
    const win=Math.min(total, Math.max(10, Math.min(30, total*0.3)));
    if(left>=win) return 1;
    return 1 + (TEMPO_MAX-1)*(1-Math.max(0,left)/win);
  }
  function musicStart(){
    if(playing || !S.music || (typeof document!=="undefined" && document.hidden)) return;
    try{
      const c=ctx(); if(!c) return;
      resume();
      mBus=c.createGain(); mBus.gain.setValueAtTime(0,c.currentTime); mBus.gain.linearRampToValueAtTime(MUSIC_LEVEL,c.currentTime+3); mBus.connect(out);
      eng=Engine(c, mBus, (Math.random()*4294967295)>>>0);
      eng.start(c.currentTime+0.15); playing=true; tick(); timer=setInterval(tick, 200);
    }catch(e){ playing=false; }
  }
  function musicStop(fade){
    if(!playing) return;
    playing=false; clearInterval(timer); timer=null; eng=null;
    const b=mBus; mBus=null;
    try{ const t=ac.currentTime, f=fade==null?0.8:fade; b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value,t); b.gain.linearRampToValueAtTime(0,t+f); setTimeout(()=>{ try{ b.disconnect(); }catch(e){} }, f*1000+150); }catch(e){}
  }
  /* offline render for tests: returns {sampleRate, channels:[Float32Array,...], tempoLog:[[t,tempo],...]}
     tempoFn(t) (optional) gives the wanted tempo at time t, e.g. to render a ramp */
  function renderMusic(secs, sr, seed, tempoFn){
    const OC = W.OfflineAudioContext || W.webkitOfflineAudioContext;
    if(!OC) return Promise.reject(new Error("no OfflineAudioContext"));
    const c = new OC(2, Math.ceil(secs*sr), sr);
    const lim = limiter(c); lim.connect(c.destination);
    const bus = c.createGain(); bus.gain.setValueAtTime(0,0); bus.gain.linearRampToValueAtTime(MUSIC_LEVEL,3); bus.connect(lim);
    const e = Engine(c, bus, seed==null?12345:seed), log=[];
    e.start(0.1); e.advance(secs, typeof tempoFn==="function" ? tempoFn : ()=>1, log);
    return c.startRendering().then(buf=>({sampleRate:buf.sampleRate, channels:[buf.getChannelData(0), buf.getChannelData(1)], tempoLog:log}));
  }
  function renderSfx(kind, sr){
    const OC = W.OfflineAudioContext || W.webkitOfflineAudioContext;
    const c = new OC(1, Math.ceil(2*sr), sr), lim=limiter(c); lim.connect(c.destination);
    SFX[kind](c, lim, 0.01);
    return c.startRendering().then(buf=>buf.getChannelData(0));
  }

  /* ---------------- 🔊 panel ---------------- */
  let opener=null;
  function el(id){ return document.getElementById(id); }
  function buildPanel(){
    if(el("afxPanel")) return;
    const d=document.createElement("div");
    d.id="afxPanel"; d.className="afx-backdrop"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-labelledby","afxTitle");
    d.innerHTML =
      '<div class="afx-modal">'+
      '<h3 id="afxTitle">🔊 Sound settings</h3>'+
      '<button type="button" class="afx-row" id="afxSfx" role="switch"><span class="afx-ico" aria-hidden="true">🔔</span>'+
        '<span class="afx-txt"><b>Sounds</b><small>Clicks, right and wrong answers, round complete. On at the start.</small></span>'+
        '<span class="afx-sw" aria-hidden="true"><span class="afx-knob"></span></span><span class="afx-state"></span></button>'+
      '<button type="button" class="afx-row" id="afxMusic" role="switch"><span class="afx-ico" aria-hidden="true">🎵</span>'+
        '<span class="afx-txt"><b>Music</b><small>Calm background music. Off at the start: turn it on if you like.</small></span>'+
        '<span class="afx-sw" aria-hidden="true"><span class="afx-knob"></span></span><span class="afx-state"></span></button>'+
      '<p class="afx-note" id="afxNote"></p>'+
      '<button type="button" class="afx-done" id="afxDone">Done</button></div>';
    document.body.appendChild(d);
    d.addEventListener("click", e=>{ if(e.target===d) close(); });
    el("afxSfx").addEventListener("click", ()=>{ S.sfx=!S.sfx; save(); sync(); if(S.sfx) play("ok"); });
    el("afxMusic").addEventListener("click", ()=>{ S.music=!S.music; save(); unlocked=true; if(S.music) musicStart(); else musicStop(); sync(); });
    el("afxDone").addEventListener("click", close);
  }
  function isOpen(){ const p=el("afxPanel"); return !!(p && p.classList.contains("show")); }
  function open(from){ buildPanel(); opener=from||document.activeElement; sync(); el("afxPanel").classList.add("show"); autoCheck(); setTimeout(()=>{ const b=el("afxSfx"); if(b) b.focus(); },30); }
  function close(){ const p=el("afxPanel"); if(!p || !p.classList.contains("show")) return; p.classList.remove("show"); autoCheck(); try{ if(opener && opener.focus && document.contains(opener)) opener.focus(); }catch(e){} opener=null; }
  function sync(){
    const on = S.sfx||S.music;
    document.querySelectorAll('[data-fx="panel"]').forEach(b=>{
      b.textContent = on ? "🔊" : "🔇";
      const lab = `Sound settings. Sounds ${S.sfx?"on":"off"}, music ${S.music?"on":"off"}`;
      b.setAttribute("aria-label", lab); b.title = lab;
    });
    [["afxSfx",S.sfx],["afxMusic",S.music]].forEach(([id,v])=>{ const b=el(id); if(!b) return; b.setAttribute("aria-checked", String(v)); b.classList.toggle("on", v); b.querySelector(".afx-state").textContent = v ? "On" : "Off"; });
    const n=el("afxNote"); if(n) n.textContent = AC_CLASS ? "Your choice is saved on this device." : "Sound isn't available in this browser, but the game works fine without it.";
  }

  /* ---------------- points burst ---------------- */
  const DOTS = ["#ffd166","#00f5d4","#ff4d9e","#c44dff"];
  function reduced(){ try{ return W.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
  function burst(anchor, text, sub){
    try{
      let x=W.innerWidth/2, y=W.innerHeight/2;
      if(anchor && anchor.getBoundingClientRect){ const r=anchor.getBoundingClientRect(); if(r.width||r.height){ x=r.left+r.width/2; y=r.top+Math.min(10, r.height/2); } }
      x=Math.max(105,Math.min(W.innerWidth-105,x)); y=Math.max(90,Math.min(W.innerHeight-20,y));
      const still=reduced(), w=document.createElement("div");
      w.className="afx-burst"+(still?" still":""); w.setAttribute("aria-hidden","true"); w.style.left=x+"px"; w.style.top=y+"px";
      let h='<div class="afx-pts">'+text+(sub?'<small>'+sub+'</small>':'')+'</div>';
      if(!still) for(let i=0;i<12;i++){ const a=i/12*Math.PI*2+Math.random()*0.4, r=30+Math.random()*28;
        h+=`<i class="afx-dot" style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px;--c:${DOTS[i%4]}"></i>`; }
      w.innerHTML=h; document.body.appendChild(w); setTimeout(()=>w.remove(), 950);
    }catch(e){}
  }
  /* ---------------- auto-advance after a correct answer ----------------
     One job at a time. It waits `ms`, pausing while the 🔊 panel (or a game modal, via init's
     `paused` option) is open or the tab is hidden, then calls fn once. cancelAuto() stops it
     (every Next/skip, leaving a screen or starting a round must call it, so nothing advances twice).
     An optional button gets a thin progress bar (no bar with reduced motion). */
  let autoJob=null, autoIv=null, pausedHook=null;
  function autoPausedNow(){ try{ return isOpen() || (typeof document!=="undefined" && document.hidden) || !!(pausedHook && pausedHook()); }catch(e){ return false; } }
  function autoBtn(j, cls, on){ try{ if(j && j.btn) j.btn.classList.toggle(cls, on); }catch(e){} }
  function autoCheck(){
    const j=autoJob; if(!j){ clearInterval(autoIv); autoIv=null; return; }
    const p=autoPausedNow();
    if(p && j.id){ clearTimeout(j.id); j.id=null; j.left -= Date.now()-j.t0; autoBtn(j,"afx-auto-paused",true); }
    else if(!p && !j.id){
      j.t0=Date.now(); autoBtn(j,"afx-auto-paused",false);
      j.id=setTimeout(()=>{ if(autoJob!==j) return; autoJob=null; autoBtn(j,"afx-auto",false); clearInterval(autoIv); autoIv=null; try{ j.fn(); }catch(e){ try{ console.warn(e); }catch(_){} } }, Math.max(0, j.left));
    }
  }
  function autoAdvance(fn, ms, btn){
    cancelAuto();
    const j={fn, left: ms==null?1500:ms, t0:0, id:null, btn:btn||null};
    autoJob=j;
    if(j.btn){ try{ j.btn.style.setProperty("--afx-auto", j.left+"ms"); j.btn.classList.remove("afx-auto","afx-auto-paused"); void j.btn.offsetWidth; j.btn.classList.add("afx-auto"); }catch(e){} }
    autoCheck();
    if(!autoIv) autoIv=setInterval(autoCheck, 100);
    return true;
  }
  function cancelAuto(){
    const j=autoJob; autoJob=null; clearInterval(autoIv); autoIv=null;
    if(j){ clearTimeout(j.id); autoBtn(j,"afx-auto",false); autoBtn(j,"afx-auto-paused",false); }
  }
  function autoState(){ const j=autoJob; if(!j) return null; return {paused:!j.id, left: j.id ? Math.max(0, j.left-(Date.now()-j.t0)) : j.left}; }

  function bump(node){ try{ if(!node || reduced()) return; node.classList.remove("afx-bump"); void node.offsetWidth; node.classList.add("afx-bump"); }catch(e){} }

  /* ---------------- wiring ---------------- */
  function onGesture(e){
    if(e && e.isTrusted===false) return;
    unlocked=true; if(S.sfx || S.music) resume();   /* sound fully off: never create an AudioContext */
    if(S.music && !playing) musicStart();
  }
  function init(opts){
    opts = opts || {};
    if(opts.key) KEY=opts.key;
    if(typeof opts.paused==="function") pausedHook=opts.paused;
    load();
    try{
      ["pointerdown","keydown","touchend"].forEach(ev=>document.addEventListener(ev, onGesture, true));
      /* soft click on every button / tile press (the panel's own switches included) */
      document.addEventListener("click", e=>{ const b=e.target && e.target.closest && e.target.closest("button,[role=button]"); if(b && !b.disabled) play("click"); }, true);
      document.addEventListener("click", e=>{ const b=e.target && e.target.closest && e.target.closest('[data-fx="panel"]'); if(b){ e.preventDefault(); open(b); } });
      /* while the panel is open, keys go to the panel only (no answering behind it) */
      W.addEventListener("keydown", e=>{ if(!isOpen()) return; if(e.key==="Escape"){ e.preventDefault(); close(); } e.stopImmediatePropagation(); }, true);
      document.addEventListener("visibilitychange", ()=>{
        if(document.hidden){ if(playing){ hiddenPause=true; musicStop(0.25); } setTimeout(()=>{ try{ if(document.hidden && ac && !playing && ac.state==="running") ac.suspend().catch(()=>{}); }catch(e){} }, 400); }
        else { if(ac && gestureSeen()) resume(); if(hiddenPause){ hiddenPause=false; musicStart(); } }
      });
    }catch(e){}
    sync();
  }
  return {
    init, play, sync, open, close, isOpen, burst, bump,
    click:()=>play("click"), ok:()=>play("ok"), bad:()=>play("bad"), fanfare:()=>play("fanfare"), soft:()=>play("soft"),
    get sfx(){ return S.sfx; }, get music(){ return S.music; },
    state:()=>({sfx:S.sfx, music:S.music, playing, hasAudio:!!AC_CLASS, ctx:ac?ac.state:null, bar:eng?eng.bar:0, open:isOpen(),
      tempo: eng ? Math.round(eng.tempo*1000)/1000 : 1, tempoTarget, schedT: eng ? eng.time : 0, auto:autoState()}),
    setTempo, tempoForQuestion, tempoForTime, get tempoTarget(){ return tempoTarget; },
    autoAdvance, cancelAuto, autoState, reduced,
    renderMusic, renderSfx, _musicStart:musicStart, _musicStop:musicStop
  };
